plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.example.balloonwallpaper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.balloonwallpaper'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

kotlin {
    jvmToolchain(17)
}
